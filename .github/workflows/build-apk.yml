name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ⭐ 核心修复 1：恢复 Java 17，满足 share_plus 插件的要求
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # 删除旧工程，重新生成干净工程
      - name: Remove old Android project
        run: rm -rf android

      - name: Create Android project
        run: |
          flutter create \
            --platforms=android \
            --project-name banbiao_xiaoli \
            --org com.example \
            .

      # 修复 Kotlin 版本
      - name: Fix Kotlin Gradle Plugin Version
        run: |
          sed -i 's|ext.kotlin_version = .*|ext.kotlin_version = "1.9.22"|' android/build.gradle
          sed -i 's|id "org.jetbrains.kotlin.android" version ".*"|id "org.jetbrains.kotlin.android" version "1.9.22"|' android/settings.gradle

      # ⭐ 核心修复 2：精准配置 Java 17、脱糖、彻底禁用 Lint 和代码缩减
      - name: Configure Gradle for Java 17, desugaring, and disabled Lint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle")
          content = path.read_text()

          # 1. 强制显式设置 Java 17 兼容性
          if "sourceCompatibility JavaVersion.VERSION_17" not in content:
              content = content.replace(
                  "compileOptions {",
                  "compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17"
              )

          # 2. 开启脱糖
          if "coreLibraryDesugaringEnabled true" not in content:
              content = content.replace(
                  "compileOptions {",
                  "compileOptions {\n        coreLibraryDesugaringEnabled true"
              )

          # 3. 彻底禁用 Lint 检查 (这是之前导致 R8 崩溃的罪魁祸首)
          if "checkReleaseBuilds false" not in content:
              content = content.replace(
                  "android {",
                  "android {\n    lint { checkReleaseBuilds false abortOnError false }"
              )

          # 4. 彻底关闭代码缩减 (即使没有 --no-shrink，这里也关闭)
          if "minifyEnabled false" not in content:
              content = content.replace(
                  "buildTypes {",
                  "buildTypes {\n        release {\n            minifyEnabled false\n            shrinkResources false\n        }"
              )

          # 5. 注入脱糖依赖
          if "desugar_jdk_libs:2.0.4" not in content:
              content += """

          dependencies {
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
          }
          """
          path.write_text(content)
          print("Gradle configured for Java 17 with disabled Lint.")
          PY

      # 配置 Manifest 权限和接收器
      - name: Configure notification manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />',
              '<uses-permission android:name="android.permission.USE_EXACT_ALARM" />',
              '<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />',
              '<uses-permission android:name="android.permission.VIBRATE" />'
          ]
          for permission in permissions:
              if permission not in content:
                  content = content.replace("<application", permission + "\n    <application", 1)

          application_pattern = r'<application\b[^>]*>'
          match = re.search(application_pattern, content, flags=re.DOTALL)
          if match:
              application_tag = match.group(0)
              if "android:label=" in application_tag:
                  application_tag = re.sub(r'android:label="[^"]*"', 'android:label="我的记录"', application_tag, count=1)
              else:
                  application_tag = application_tag[:-1] + ' android:label="我的记录">'
              content = content[:match.start()] + application_tag + content[match.end():]

          receiver_text = """
              <receiver android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" android:exported="false" />
              <receiver android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver" android:exported="true">
                  <intent-filter>
                      <action android:name="android.intent.action.BOOT_COMPLETED" />
                      <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                  </intent-filter>
              </receiver>
          """
          if "ScheduledNotificationReceiver" not in content:
              content = content.replace("</application>", receiver_text + "\n    </application>", 1)

          path.write_text(content)
          print("Manifest configured.")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons

      # 使用 --no-shrink 双重保险
      - name: Build release APK
        run: flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: banbiao-xiaoli-apk
          path: build/app/outputs/flutter-apk/app-release.apk