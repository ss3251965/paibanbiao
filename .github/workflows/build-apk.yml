name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create Android platform
        run: flutter create --platforms=android --project-name banbiao_xiaoli --org com.example .

      - name: Fix Android Gradle and Kotlin Versions
        run: |
          sed -i 's|com.android.application.*version.*|com.android.application version "7.4.2" apply false|' android/settings.gradle
          sed -i 's|id "org.jetbrains.kotlin.android" version ".*"|id "org.jetbrains.kotlin.android" version "1.9.22"|' android/settings.gradle

          sed -i 's|ext.kotlin_version = .*|ext.kotlin_version = "1.9.22"|' android/build.gradle
          sed -i 's|com.android.tools.build:gradle:[^'\'']*|com.android.tools.build:gradle:7.4.2|' android/build.gradle

      - name: Fix Gradle Wrapper
        run: |
          sed -i 's|gradle-[0-9.]*-all.zip|gradle-7.5-all.zip|' android/gradle/wrapper/gradle-wrapper.properties

      - name: Fix Desugaring for Notifications
        run: |
          cat << 'EOF' > fix_desugar.py
          path = "android/app/build.gradle"

          with open(path, "r") as f:
              content = f.read()

          # 开启 core library desugaring
          if "coreLibraryDesugaringEnabled true" not in content:
              content = content.replace(
                  "compileOptions {",
                  "compileOptions {\n"
                  "        coreLibraryDesugaringEnabled true\n"
                  "        sourceCompatibility JavaVersion.VERSION_1_8\n"
                  "        targetCompatibility JavaVersion.VERSION_1_8"
              )

          # 使用与当前 flutter_local_notifications 兼容的 desugar_jdk_libs
          content = content.replace(
              "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'",
              "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.2.2'"
          )

          if "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.2.2'" not in content:
              idx = content.find("dependencies {")

              if idx != -1:
                  content = (
                      content[:idx]
                      + "dependencies {\n"
                      + "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.2.2'\n"
                      + content[idx + len("dependencies {"):]
                  )
              else:
                  content += (
                      "\n"
                      "dependencies {\n"
                      "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.2.2'\n"
                      "}\n"
                  )

          with open(path, "w") as f:
              f.write(content)
          EOF

          python3 fix_desugar.py

      - name: Add Notification Permissions
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <application|' android/app/src/main/AndroidManifest.xml

      - name: Add Notification Receivers
        run: |
          sed -i 's|</application>|    <receiver android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" android:exported="false" />\n        <receiver android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver" android:exported="false">\n            <intent-filter>\n                <action android:name="android.intent.action.BOOT_COMPLETED" />\n                <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />\n                <action android:name="android.intent.action.QUICKBOOT_POWERON" />\n            </intent-filter>\n        </receiver>\n    </application>|' android/app/src/main/AndroidManifest.xml

      - name: Set App Name
        run: |
          sed -i 's/android:label=".*"/android:label="我的记录"/' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Clean Flutter Build
        run: |
          flutter clean
          flutter pub get

      - name: Build release APK
        run: flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: banbiao-xiaoli-apk
          path: build/app/outputs/flutter-apk/app-release.apk