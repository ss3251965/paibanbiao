name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create Android platform
        run: flutter create --platforms=android --project-name banbiao_xiaoli --org com.example .

      - name: Fix Kotlin Gradle Plugin Version
        run: |
          sed -i 's|ext.kotlin_version = .*|ext.kotlin_version = "1.9.22"|' android/build.gradle
          sed -i 's|id "org.jetbrains.kotlin.android" version ".*"|id "org.jetbrains.kotlin.android" version "1.9.22"|' android/settings.gradle

      - name: Fix Desugaring for Notifications
        run: |
          cat << 'EOF' > fix_desugar.py
          path = "android/app/build.gradle"

          with open(path, "r") as f:
              content = f.read()

          # 开启 Java 8+ API desugaring
          if "coreLibraryDesugaringEnabled" not in content:
              content = content.replace(
                  "compileOptions {",
                  "compileOptions {\n        coreLibraryDesugaringEnabled true"
              )

          # 添加 desugaring 依赖
          if "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'" not in content:
              idx = content.find("android {")

              if idx != -1:
                  depth = 0
                  end_idx = None

                  for i in range(idx, len(content)):
                      if content[i] == "{":
                          depth += 1
                      elif content[i] == "}":
                          depth -= 1

                          if depth == 0:
                              end_idx = i
                              break

                  if end_idx is not None:
                      content = (
                          content[:end_idx]
                          + "\n    dependencies {\n"
                          + "        coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'\n"
                          + "    }\n"
                          + content[end_idx:]
                      )

          with open(path, "w") as f:
              f.write(content)
          EOF

          python3 fix_desugar.py

      - name: Add Notification Permissions
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <application|' android/app/src/main/AndroidManifest.xml

      - name: Add Notification Receivers
        run: |
          sed -i 's|</application>|    <receiver android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" android:exported="false" />\n        <receiver android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver" android:exported="false">\n            <intent-filter>\n                <action android:name="android.intent.action.BOOT_COMPLETED" />\n                <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />\n                <action android:name="android.intent.action.QUICKBOOT_POWERON" />\n            </intent-filter>\n        </receiver>\n    </application>|' android/app/src/main/AndroidManifest.xml

      - name: Set App Name
        run: |
          sed -i 's/android:label=".*"/android:label="我的记录"/' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: banbiao-xiaoli-apk
          path: build/app/outputs/flutter-apk/app-release.apk