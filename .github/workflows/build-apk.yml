name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create Android platform
        run: flutter create --platforms=android --project-name banbiao_xiaoli --org com.example .

      - name: Fix Kotlin Gradle Plugin Version
        run: |
          sed -i 's|ext.kotlin_version = .*|ext.kotlin_version = "1.9.22"|' android/build.gradle
          sed -i 's|id "org.jetbrains.kotlin.android" version ".*"|id "org.jetbrains.kotlin.android" version "1.9.22"|' android/settings.gradle

      - name: Enable Core Library Desugaring for Notifications
        run: |
          sed -i 's/compileOptions {/compileOptions {\n        coreLibraryDesugaringEnabled true/' android/app/build.gradle
          sed -i 's/dependencies {/dependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"/' android/app/build.gradle

      - name: Add Notification Permissions and Receivers to AndroidManifest
        run: |
          python3 -c "
import os
manifest_path = 'android/app/src/main/AndroidManifest.xml'
with open(manifest_path, 'r') as f:
    content = f.read()

perms = '''    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />
    <uses-permission android:name=\"android.permission.SCHEDULE_EXACT_ALARM\" />
    <uses-permission android:name=\"android.permission.USE_EXACT_ALARM\" />
    <uses-permission android:name=\"android.permission.RECEIVE_BOOT_COMPLETED\" />
    <uses-permission android:name=\"android.permission.VIBRATE\" />
'''
if 'POST_NOTIFICATIONS' not in content:
    content = content.replace('<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">', '<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n' + perms)

receivers = '''        <receiver android:name=\"com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver\" />
        <receiver android:name=\"com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver\">
            <intent-filter>
                <action android:name=\"android.intent.action.BOOT_COMPLETED\" />
                <action android:name=\"android.intent.action.MY_PACKAGE_REPLACED\" />
                <action android:name=\"android.intent.action.QUICKBOOT_POWERON\" />
            </intent-filter>
        </receiver>
'''
if 'ScheduledNotificationReceiver' not in content:
    content = content.replace('</application>', receivers + '\n</application>')

with open(manifest_path, 'w') as f:
    f.write(content)
"

      - name: Set App Name
        run: |
          sed -i 's/android:label=".*"/android:label="我的记录"/' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: banbiao-xiaoli-apk
          path: build/app/outputs/flutter-apk/app-release.apk