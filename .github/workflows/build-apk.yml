name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Check versions
        run: |
          flutter --version
          java -version

      # 删除之前被修改坏的 Android 工程
      - name: Remove old Android project
        run: |
          rm -rf android

      # 使用 Flutter 3.24.0 重新生成干净 Android 工程
      - name: Create Android project
        run: |
          flutter create \
            --platforms=android \
            --project-name banbiao_xiaoli \
            --org com.example \
            .

      # flutter_local_notifications 17.2.2 所需的 desugaring
      - name: Configure desugaring
        run: |
          python3 -c "
          from pathlib import Path

          p = Path('android/app/build.gradle')
          s = p.read_text()

          if 'coreLibraryDesugaringEnabled true' not in s:
              s = s.replace(
                  'compileOptions {',
                  'compileOptions {\\n        coreLibraryDesugaringEnabled true',
                  1
              )

          if 'desugar_jdk_libs:1.2.2' not in s:
              s += '''
          dependencies {
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.2.2'
          }
          '''

          p.write_text(s)
          "

      # 配置通知权限和通知 Receiver
      - name: Configure notification manifest
        run: |
          python3 -c "
          from pathlib import Path

          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()

          permissions = [
              '<uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />',
              '<uses-permission android:name=\"android.permission.SCHEDULE_EXACT_ALARM\" />',
              '<uses-permission android:name=\"android.permission.RECEIVE_BOOT_COMPLETED\" />',
              '<uses-permission android:name=\"android.permission.VIBRATE\" />'
          ]

          for permission in permissions:
              if permission not in s:
                  s = s.replace(
                      '<application',
                      permission + '\\n    <application',
                      1
                  )

          s = s.replace(
              'android:label=\"banbiao_xiaoli\"',
              'android:label=\"我的记录\"',
              1
          )

          receivers = '''
              <receiver
                  android:exported=\"false\"
                  android:name=\"com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver\" />

              <receiver
                  android:exported=\"false\"
                  android:name=\"com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver\">
                  <intent-filter>
                      <action android:name=\"android.intent.action.BOOT_COMPLETED\" />
                      <action android:name=\"android.intent.action.MY_PACKAGE_REPLACED\" />
                      <action android:name=\"android.intent.action.QUICKBOOT_POWERON\" />
                      <action android:name=\"com.htc.intent.action.QUICKBOOT_POWERON\" />
                  </intent-filter>
              </receiver>
          '''

          if 'ScheduledNotificationReceiver' not in s:
              s = s.replace(
                  '</application>',
                  receivers + '\\n    </application>',
                  1
              )

          p.write_text(s)
          "

      - name: Check app icon
        run: |
          if [ ! -f "icon.jpg" ]; then
            echo "ERROR: icon.jpg not found in project root"
            exit 1
          fi

      - name: Install dependencies
        run: |
          flutter pub get

      - name: Generate Launcher Icons
        run: |
          dart run flutter_launcher_icons

      - name: Verify Android configuration
        run: |
          echo "===== Android settings.gradle ====="
          cat android/settings.gradle

          echo ""
          echo "===== Desugaring ====="
          grep -n -A3 -B3 "desugar" android/app/build.gradle || true

          echo ""
          echo "===== Notification receivers ====="
          grep -n -A12 -B2 "ScheduledNotification" \
            android/app/src/main/AndroidManifest.xml || true

      - name: Build release APK
        run: |
          flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: banbiao-xiaoli-apk
          path: build/app/outputs/flutter-apk/app-release.apk